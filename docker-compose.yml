# Local development services. Credentials here are for the local containers only.
# PostgreSQL is published on 5433 so it never clashes with a PostgreSQL installed on the host.
name: waretrack

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: waretrack
      POSTGRES_USER: waretrack
      POSTGRES_PASSWORD: waretrack
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waretrack -d waretrack"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
