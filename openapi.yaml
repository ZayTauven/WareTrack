          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Member'
          description: ''
  /api/v1/orgs/{org}/members/{user_id}/:
    patch:
      operationId: v1_orgs_members_partial_update
      description: Changes a member's role (admin; owner role changes need an owner).
      parameters:
      - in: path
        name: org
        schema:
          type: string
        description: Organization slug.
        required: true
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedRoleChangeRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Member'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionRejected'
          description: ''
    delete:
      operationId: v1_orgs_members_destroy
      description: Removes someone from the organization (their account stays).
      parameters:
      - in: path
        name: org
        schema:
          type: string
        description: Organization slug.
        required: true
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '409':
          content:
            application/json:
              schema:
