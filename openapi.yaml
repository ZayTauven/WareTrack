  /api/v1/orgs/{org}/forklifts/{id}/assign/:
    post:
      operationId: v1_orgs_forklifts_assign_create
      description: Lists and details of one entity type within the organization, filterable
        by site (and status).
      summary: Put a forklift on a docked shipment, or release it with null (operator)
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this forklift.
        required: true
      - in: path
        name: org
        schema:
          type: string
        description: Organization slug.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignForkliftRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patch'
          description: ''
        '403':
          description: No response body
        '404':
          description: No response body
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionRejected'
          description: ''
  /api/v1/orgs/{org}/forklifts/{id}/charge/:
    post:
      operationId: v1_orgs_forklifts_charge_create
      description: Lists and details of one entity type within the organization, filterable
