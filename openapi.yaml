        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionRejected'
          description: ''
components:
  schemas:
    AcceptInvitationRequest:
      type: object
      properties:
        password:
          type: string
          writeOnly: true
          minLength: 1
        firstName:
