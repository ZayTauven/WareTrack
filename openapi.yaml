components:
  schemas:
    Access:
      type: object
      properties:
        access:
          type: string
      required:
      - access
    BuildingSize:
      type: object
      properties:
        width:
          type: number
          format: double
        depth:
          type: number
          format: double
      required:
      - depth
      - width
    CategoryEnum:
      enum:
      - electronics
      - home
      - grocery
      - apparel
      - automotive
      - pharma
      type: string
      description: |-
        * `electronics` - Electronics
        * `home` - Home
        * `grocery` - Grocery
        * `apparel` - Apparel
        * `automotive` - Automotive
        * `pharma` - Pharma
    DirectionEnum:
      enum:
      - inbound
      - outbound
      type: string
      description: |-
        * `inbound` - Inbound
        * `outbound` - Outbound
    Dock:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        siteId:
          type: string
          format: uuid
        number:
          type: integer
          maximum: 32767
          minimum: 0
        name:
          type: string
          maxLength: 40
        state:
          $ref: '#/components/schemas/StateEnum'
        position:
          $ref: '#/components/schemas/FloorPoint'
        rotationY:
          type: number
          format: double
      required:
      - id
      - name
      - number
      - position
      - rotationY
      - siteId
    FloorPoint:
      type: object
      properties:
        x:
          type: number
          format: double
        z:
          type: number
          format: double
      required:
      - x
      - z
    FloorRect:
      type: object
      properties:
        minX:
          type: number
          format: double
        maxX:
          type: number
          format: double
        minZ:
          type: number
          format: double
        maxZ:
          type: number
          format: double
      required:
      - maxX
      - maxZ
      - minX
      - minZ
    Forklift:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 40
        siteId:
          type: string
          format: uuid
        operator:
          type: string
          nullable: true
          readOnly: true
        status:
          $ref: '#/components/schemas/ForkliftStatusEnum'
        batteryPct:
          type: integer
        shipmentId:
          type: string
          format: uuid
          nullable: true
        position:
          $ref: '#/components/schemas/FloorPoint'
        rotationY:
          type: number
          format: double
        updatedAt:
          type: string
          format: date-time
      required:
      - batteryPct
      - id
      - name
      - operator
      - position
      - rotationY
      - shipmentId
      - siteId
      - updatedAt
    ForkliftStatusEnum:
      enum:
      - idle
      - moving
      - lifting
      - charging
      - maintenance
      type: string
      description: |-
        * `idle` - Idle
        * `moving` - Moving
        * `lifting` - Lifting
        * `charging` - Charging
        * `maintenance` - Maintenance
    InventoryItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        sku:
          type: string
          maxLength: 32
        name:
          type: string
          maxLength: 160
        category:
          $ref: '#/components/schemas/CategoryEnum'
        siteId:
          type: string
          format: uuid
        rackId:
          type: string
          format: uuid
        level:
          type: integer
          maximum: 32767
          minimum: 0
        quantity:
          type: integer
          maximum: 2147483647
          minimum: 0
        unit:
          $ref: '#/components/schemas/UnitEnum'
        reorderPoint:
          type: integer
        updatedAt:
          type: string
          format: date-time
      required:
      - category
      - id
      - level
      - name
      - quantity
      - rackId
      - reorderPoint
      - siteId
      - sku
      - unit
      - updatedAt
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - email
      - password
    Me:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          maxLength: 254
        firstName:
          type: string
        lastName:
          type: string
        organizations:
          type: array
          items:
            $ref: '#/components/schemas/Membership'
      required:
      - email
      - firstName
      - id
      - lastName
      - organizations
    Membership:
      type: object
      properties:
        slug:
          type: string
        name:
          type: string
        role:
          $ref: '#/components/schemas/MembershipRoleEnum'
      required:
      - name
      - slug
    MembershipRoleEnum:
      enum:
      - owner
      - admin
      - operator
      - viewer
      type: string
      description: |-
        * `owner` - Owner
        * `admin` - Admin
        * `operator` - Operator
        * `viewer` - Viewer
    Origin:
      type: object
      properties:
        x:
          type: number
          format: double
        z:
          type: number
          format: double
      required:
      - x
      - z
    PaginatedDockList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/Dock'
    PaginatedForkliftList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/Forklift'
    PaginatedInventoryItemList:
      type: object
