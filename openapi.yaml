openapi: 3.0.3
info:
  title: WareTrack API
  version: 1.0.0
  description: 'Multi-tenant warehouse operations: sites, docks, racks, trucks, forklifts,
    inventory, shipments.'
paths:
  /api/v1/auth/login/:
    post:
      operationId: v1_auth_login_create
      description: |-
        Public endpoints that answer 401 (not 403) when credentials are wrong.

        DRF downgrades 401 to 403 when a view has no authenticate header to send; these
        views authenticate by body or cookie, so they declare the Bearer scheme themselves.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: v1_auth_logout_create
      description: |-
        Public endpoints that answer 401 (not 403) when credentials are wrong.

        DRF downgrades 401 to 403 when a view has no authenticate header to send; these
        views authenticate by body or cookie, so they declare the Bearer scheme themselves.
      tags:
      - v1
      responses:
        '204':
          description: No response body
  /api/v1/auth/refresh/:
    post:
      operationId: v1_auth_refresh_create
      description: |-
        Public endpoints that answer 401 (not 403) when credentials are wrong.

        DRF downgrades 401 to 403 when a view has no authenticate header to send; these
        views authenticate by body or cookie, so they declare the Bearer scheme themselves.
      tags:
      - v1
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Access'
          description: ''
        '401':
          description: No response body
  /api/v1/me/:
    get:
      operationId: v1_me_retrieve
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/orgs/{org}/docks/:
    get:
      operationId: v1_orgs_docks_list
      description: Lists and details of one entity type within the organization, filterable
        by site (and status).
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: path
        name: org
        schema:
          type: string
        description: Organization slug.
        required: true
      - in: query
        name: site
        schema:
          type: string
          format: uuid
        description: Only records of this site.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDockList'
          description: ''
