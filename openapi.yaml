  /api/v1/orgs/{org}/invitations/:
    get:
      operationId: v1_orgs_invitations_list
      description: Invitations still waiting to be accepted.
      parameters:
      - in: path
        name: org
        schema:
          type: string
        description: Organization slug.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invitation'
          description: ''
    post:
      operationId: v1_orgs_invitations_create
      description: Invites an email address with a role. The link is in the response,
        and only there.
      parameters:
      - in: path
        name: org
        schema:
          type: string
        description: Organization slug.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationCreated'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionRejected'
          description: ''
  /api/v1/orgs/{org}/invitations/{invitation_id}/:
    delete:
      operationId: v1_orgs_invitations_destroy
      description: 'Revokes an invitation: its link stops working.'
      parameters:
      - in: path
        name: invitation_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: org
        schema:
          type: string
        description: Organization slug.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/orgs/{org}/members/:
    get:
      operationId: v1_orgs_members_list
      description: Everyone in the organization, with their role. Visible to every
        member.
      parameters:
      - in: path
        name: org
        schema:
          type: string
        description: Organization slug.
        required: true
      tags:
      - v1
      security:
