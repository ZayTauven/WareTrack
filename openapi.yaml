          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/Site'
    PaginatedTruckList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=400&limit=100
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?offset=200&limit=100
        results:
          type: array
          items:
            $ref: '#/components/schemas/Truck'
    Rack:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        siteId:
          type: string
          format: uuid
        code:
          type: string
          description: Location code, e.g. A-03.
          maxLength: 16
        zone:
          type: string
          maxLength: 8
        levels:
          type: integer
          maximum: 32767
          minimum: 0
          description: Storage levels; level 0 is the floor.
        size:
          $ref: '#/components/schemas/RackSize'
        position:
          $ref: '#/components/schemas/FloorPoint'
        rotationY:
          type: number
          format: double
      required:
      - code
      - id
      - levels
      - position
      - rotationY
      - siteId
      - size
      - zone
    RackSize:
      type: object
      properties:
        length:
          type: number
          format: double
        depth:
          type: number
          format: double
        height:
          type: number
          format: double
      required:
      - depth
      - height
      - length
    Session:
      type: object
      properties:
        access:
          type: string
        user:
          $ref: '#/components/schemas/Me'
      required:
      - access
      - user
    Shipment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        reference:
          type: string
          maxLength: 32
        siteId:
          type: string
          format: uuid
        direction:
          $ref: '#/components/schemas/DirectionEnum'
        status:
          $ref: '#/components/schemas/ShipmentStatusEnum'
        counterparty:
          type: string
          description: Supplier for inbound, customer for outbound.
          maxLength: 160
        truckId:
          type: string
          format: uuid
          nullable: true
        dockId:
          type: string
          format: uuid
          nullable: true
        promisedAt:
          type: string
          format: date-time
        eta:
          type: string
          format: date-time
          description: Estimated arrival; the actual arrival once the truck is on
            site.
        completedAt:
          type: string
          format: date-time
          nullable: true
        progress:
          type: number
          format: double
          description: Dock handling progress, 0 to 1.
        lines:
          type: array
          items:
            $ref: '#/components/schemas/ShipmentLine'
        updatedAt:
          type: string
          format: date-time
      required:
      - completedAt
      - counterparty
      - direction
      - dockId
      - eta
      - id
      - lines
      - promisedAt
      - reference
      - siteId
      - truckId
      - updatedAt
    ShipmentLine:
      type: object
      properties:
        itemId:
          type: string
          format: uuid
        quantity:
          type: integer
      required:
      - itemId
      - quantity
    ShipmentStatusEnum:
      enum:
      - scheduled
      - in_transit
      - at_yard
      - at_dock
      - completed
      type: string
      description: |-
        * `scheduled` - Scheduled
        * `in_transit` - In Transit
        * `at_yard` - At Yard
        * `at_dock` - At Dock
        * `completed` - Completed
    Site:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        code:
          type: string
          description: Short code shown in the UI, e.g. OAK.
          maxLength: 8
        name:
          type: string
          maxLength: 120
        city:
          type: string
          maxLength: 120
        timezone:
          type: string
          maxLength: 64
        origin:
          $ref: '#/components/schemas/Origin'
        building:
          $ref: '#/components/schemas/BuildingSize'
        bounds:
          $ref: '#/components/schemas/FloorRect'
      required:
      - bounds
      - building
      - city
      - code
      - id
      - name
      - origin
      - timezone
    SiteKpis:
      type: object
      properties:
        onTimeRate:
          type: number
          format: double
          nullable: true
        completed:
          type: integer
        docksInUse:
          type: integer
        docksOperational:
          type: integer
        activeTrucks:
          type: integer
        trucks:
          type: integer
        lowStock:
          type: integer
        items:
          type: integer
        delayed:
          type: integer
      required:
      - activeTrucks
      - completed
      - delayed
      - docksInUse
      - docksOperational
      - items
      - lowStock
      - onTimeRate
      - trucks
    Snapshot:
      type: object
      description: Everything the operations view needs, in one response (WarehouseData).
      properties:
        sites:
          type: array
          items:
            $ref: '#/components/schemas/Site'
        docks:
          type: array
          items:
            $ref: '#/components/schemas/Dock'
        racks:
          type: array
          items:
            $ref: '#/components/schemas/Rack'
        trucks:
          type: array
          items:
            $ref: '#/components/schemas/Truck'
        forklifts:
          type: array
          items:
            $ref: '#/components/schemas/Forklift'
        inventory:
          type: array
          items:
            $ref: '#/components/schemas/InventoryItem'
        shipments:
          type: array
          items:
            $ref: '#/components/schemas/Shipment'
      required:
      - docks
      - forklifts
      - inventory
      - racks
      - shipments
      - sites
      - trucks
    StateEnum:
      enum:
      - operational
      - maintenance
      type: string
      description: |-
        * `operational` - Operational
        * `maintenance` - Maintenance
    Truck:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          description: Fleet unit name, e.g. YTE-789.
          maxLength: 40
        carrier:
          type: string
          maxLength: 120
        siteId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/TruckStatusEnum'
        dockId:
          type: string
          format: uuid
          nullable: true
        position:
          $ref: '#/components/schemas/FloorPoint'
        rotationY:
          type: number
          format: double
        updatedAt:
          type: string
          format: date-time
      required:
      - carrier
      - dockId
      - id
      - name
      - position
      - rotationY
      - siteId
      - updatedAt
    TruckStatusEnum:
      enum:
      - in_transit
      - waiting
      - loading
      - unloading
      - idle
      type: string
      description: |-
        * `in_transit` - In Transit
        * `waiting` - Waiting
        * `loading` - Loading
        * `unloading` - Unloading
        * `idle` - Idle
    UnitEnum:
      enum:
      - pallet
      - case
      type: string
      description: |-
        * `pallet` - Pallet
        * `case` - Case
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
