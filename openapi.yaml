openapi: 3.0.3
info:
  title: WareTrack API
  version: 1.0.0
  description: 'Multi-tenant warehouse operations: sites, docks, racks, trucks, forklifts,
    inventory, shipments.'
paths:
  /api/v1/auth/login/:
    post:
      operationId: v1_auth_login_create
      description: Signs in with email and password. Returns an access token and sets
        the refresh cookie.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: v1_auth_logout_create
      description: Revokes the refresh token and clears its cookie.
      tags:
      - v1
      responses:
        '204':
          description: No response body
  /api/v1/auth/refresh/:
    post:
      operationId: v1_auth_refresh_create
      description: Exchanges the refresh cookie for a new access token, rotating the
        cookie.
      tags:
      - v1
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Access'
          description: ''
        '401':
          description: No response body
  /api/v1/invitations/{token}/:
    get:
      operationId: v1_invitations_retrieve
      description: What the invitation is for, so the page can show it before asking
        for a password.
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - v1
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPreview'
          description: ''
        '404':
          description: No response body
  /api/v1/invitations/{token}/accept/:
    post:
      operationId: v1_invitations_accept_create
      description: 'Accepts the invitation and signs in: same answer and refresh cookie
        as login.'
      parameters:
      - in: path
        name: token
        schema:
          type: string
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInvitationRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionRejected'
          description: ''
  /api/v1/me/:
    get:
      operationId: v1_me_retrieve
      description: The signed-in user and the organizations they belong to, with their
        role.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/v1/orgs/{org}/docks/:
    get:
      operationId: v1_orgs_docks_list
      description: Lists and details of one entity type within the organization, filterable
        by site (and status).
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - in: path
        name: org
        schema:
          type: string
        description: Organization slug.
        required: true
      - in: query
        name: site
        schema:
          type: string
          format: uuid
        description: Only records of this site.
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedDockList'
          description: ''
  /api/v1/orgs/{org}/docks/{id}/:
    get:
      operationId: v1_orgs_docks_retrieve
      description: Lists and details of one entity type within the organization, filterable
        by site (and status).
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this dock.
        required: true
      - in: path
        name: org
        schema:
          type: string
        description: Organization slug.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dock'
          description: ''
  /api/v1/orgs/{org}/docks/{id}/state/:
    post:
      operationId: v1_orgs_docks_state_create
      description: Lists and details of one entity type within the organization, filterable
        by site (and status).
      summary: Take a dock out of service, or put it back (admin)
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this dock.
        required: true
      - in: path
        name: org
        schema:
          type: string
        description: Organization slug.
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DockStateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patch'
          description: ''
        '403':
          description: No response body
        '404':
          description: No response body
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActionRejected'
          description: ''
  /api/v1/orgs/{org}/forklifts/:
